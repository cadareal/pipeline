# Textos do site (cadareal). Tudo o que é frase, nome amigável e explicação para leigo mora aqui; os números vêm dos
# exports (data/export/*.json) e nunca são digitados. Edite à vontade: `uv run recibo site` regenera as páginas.
# Regra de escrita: toda palavra técnica tem a explicação ao lado, na primeira vez; sem travessão; sem opinião sobre
# se o gasto é bom ou ruim.

titulo: Cada Real
slogan: o dinheiro público, real por real
url_github: https://github.com/cadareal/pipeline
url_issues: https://github.com/cadareal/pipeline/issues
url_issue_nova: https://github.com/cadareal/pipeline/issues/new/choose   # abre a escolha do modelo (número, bug, metodologia)
email_contato: contato@cadareal.org
quem_fez: Caue Bertolino
licenca: MIT
# Domínio do site no GitHub Pages. Com `dominio`, o gerador escreve docs/CNAME a cada rodada (o `--limpar` apaga a pasta
# inteira, e sem o CNAME o GitHub Pages esquece o domínio). `url` entra nos links absolutos: canonical, Open Graph (a
# prévia do link no WhatsApp e nas redes), sitemap.xml e robots.txt. Enquanto o domínio não existir, pode ficar vazio.
dominio: cadareal.org
url: https://cadareal.org/

# A bandeira é desenhada pelo próprio site (templates/_bandeira.html, geometria da Lei 5.700/1971), sem imagem de fora.
bandeira:
  rotulo: Bandeira do Brasil
  legenda: Um projeto cívico brasileiro, independente e sem partido.

# Os artigos da Constituição que resumem a filosofia do projeto. Entram em Quem somos (no lugar do marcador
# [CONSTITUICAO] do quem-somos.md) como citações, cada um com uma frase em linguagem comum; o primeiro também vai no
# rodapé de todas as páginas, ao lado da bandeira. Texto conferido com a Constituição de 1988 (art. 70 na redação da
# Emenda Constitucional 19, de 1998).
constituicao:
  titulo: O que a Constituição diz
  intro: "Três artigos da Constituição de 1988 resumem a filosofia do projeto: de quem é o poder, quem presta contas e quem pode cobrar."
  artigos:
    - rotulo: De quem é o poder
      texto: Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição.
      fonte: Constituição Federal, art. 1º, parágrafo único
      glosa: "O ponto de partida. O poder, e o dinheiro que o sustenta, são do povo. Perguntar para onde foi cada real é exercer esse poder."
    - rotulo: Quem presta contas
      texto: Prestará contas qualquer pessoa física ou jurídica, pública ou privada, que utilize, arrecade, guarde, gerencie ou administre dinheiros, bens e valores públicos ou pelos quais a União responda, ou que, em nome desta, assuma obrigações de natureza pecuniária.
      fonte: Constituição Federal, art. 70, parágrafo único
      glosa: "O dever de quem gasta. Quem mexe em dinheiro público presta contas. Os relatórios que este site lê existem por causa disso; o site só os traduz para quem não é do ramo."
    - rotulo: Quem pode cobrar
      texto: Qualquer cidadão, partido político, associação ou sindicato é parte legítima para, na forma da lei, denunciar irregularidades ou ilegalidades perante o Tribunal de Contas da União.
      fonte: Constituição Federal, art. 74, § 2º
      glosa: "O direito de quem paga. Qualquer cidadão pode levar uma irregularidade ao Tribunal de Contas da União (TCU), o órgão que fiscaliza as contas da União. Este site não denuncia nem julga: mostra os números, com a fonte de cada um, para que cada pessoa tire as próprias conclusões."

menu:
  - rotulo: Início
    caminho: ""
  - rotulo: Metodologia
    caminho: metodologia/
  - rotulo: Quem somos
    caminho: quem-somos/
