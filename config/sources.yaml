# Catálogo de fontes (a tabela "Acesso verificado" da Planilha-mãe, como código).
# Cada fetcher lê sua entrada aqui. status: implementado | planejado
# Reconhecimento feito em 2026-11-08; URLs e nomes de anexo são confirmados na primeira execução real.

fontes:
  - id: S1
    nome: Tesouro CKAN, Dívida Pública Federal (estoque, fatores de variação, emissões e resgates, execução orçamentária)
    orgao: Tesouro Nacional
    base_url: https://www.tesourotransparente.gov.br/ckan/api/3/action
    formato: csv e xlsx via CKAN (um dataset por assunto; o fetch baixa os recursos nos formatos listados)
    cadencia: mensal (últimos 10 dias do mês seguinte)
    cobertura: desde 2006 (estoque) e 2007 (fatores)
    chave: nenhuma
    camada: arquivo
    status: ativo
    timeout_http_s: 600
    # Catálogo lido em 9/nov/2026 (91 datasets no CKAN do Tesouro). DPF = Dívida Pública Federal, os títulos e contratos
    # que o Tesouro deve; DPMFi = a parte interna em títulos. O Relatório Mensal da Dívida (detentores por classe, colchão
    # de liquidez) não está no CKAN em planilha; os limites da LRF para a dívida da União pararam em 2021.
    # v0.7.0 só baixa, lacra e lê (inspect); o que cada arquivo tem de verdade define o mart na v0.7.1.
    datasets:
      estoque_dpf:
        dataset_id: 0998f610-bc25-4ce3-b32c-a873447500c2
        formatos: [CSV, XLSX]
        o_que: "estoque da DPF por mês (interna e externa; composição por indexador e por título)"
      fatores_variacao:
        dataset_id: fc2ea6ab-2130-4525-98f6-8bf04407f7fe
        formatos: [XLSX]
        o_que: "por que a dívida variou no mês: emissões, resgates e juros apropriados (os juros que o estoque gerou, pagos ou não)"
      emissoes_resgates:
        dataset_id: 48a31b6b-034a-473b-be7d-228be30437a1
        formatos: [XLSX]
        o_que: "emissões e resgates da DPF por mês"
      execucao_natureza:
        dataset_id: a95da98c-a4ab-46d5-aadb-3bb270377b85
        formatos: [CSV]
        o_que: "execução orçamentária e financeira da DPF por natureza da despesa (juros, amortização, refinanciamento), a conferir com o Anexo 01"
      tesouro_direto_estoque:
        dataset_id: 4d4dac3b-96d2-4011-92c9-ddf7d8392622
        formatos: [CSV]
        o_que: "estoque do Tesouro Direto (a parte da DPF na mão de pessoas físicas)"
    usos: ["mart divida (v0.7.1): estoque, juros apropriados, risco de rolagem; conferência do Anexo 01 com a execução da DPF"]

