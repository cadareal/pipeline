  - id: S7
    nome: COFOG, despesa do Governo Central por função (GFSM 2014)
    orgao: Tesouro Nacional (CESEF)
    base_url: https://www.tesourotransparente.gov.br/ckan/api/3/action
    # dataset "Despesas por Função do Governo Central - Classificação COFOG" no CKAN do Tesouro Transparente; um CSV por
    # ano, "Base COFOG AAAA", ~20 MB cada (2010 a 2024 em 9/nov/2026; 2024 criado em 12/dez/2025). Metadados (PDF no
    # mesmo dataset): Governo Central Orçamentário (Executivo, Legislativo, Judiciário, RPPS e RGPS; sem o Banco Central);
    # despesa liquidada mais restos a pagar não processados pagos; transferências a outros entes pelo caixa; juros por
    # competência (Banco Central); venda de bens entra negativa; coluna "Ajustes Metodológicos" para alinhar ao GFSM 2014.
    dataset_id: 22d13d17-bf69-4a1a-add2-25cc1e25f2d7
    dataset_nome: despesas-por-funcao-do-governo-central-classificacao-cofog
    recurso_regex: "^Base COFOG (\\d{4})$"
    formato: csv via CKAN (um arquivo por ano)
    cadencia: anual (um ano de defasagem; publicado depois das Estatísticas de Finanças Públicas)
    cobertura: desde 2010
    chave: nenhuma
    camada: arquivo
    status: ativo
    timeout_http_s: 600
    # guarda de escala do transform: o total de um ano, já em reais, tem que ficar nesta faixa, senão a leitura dos
    # números (ou a unidade declarada abaixo) está errada
    total_minimo_reais: 500000000000
    total_maximo_reais: 20000000000000
    # unidade da coluna de valor, por ano. O cabeçalho diz "VALOR (R$)" em todos os arquivos, mas eles não estão na mesma
    # unidade: 2019 e 2020 (republicados em mar/2025) vêm em reais com centavos; 2024 (criado em dez/2025) vem em
    # R$ milhões com duas casas, ou seja, cada linha tem resolução de R$ 10 mil. A unidade é declarada aqui, nunca
    # adivinhada: o transform multiplica pelo fator (reais 1, milhares 1.000, milhoes 1.000.000), guarda o número
    # original em `valor_fonte` e a guarda de escala para se a unidade declarada não fechar com o total do ano.
    unidade_valor_padrao: reais
    unidade_valor_por_exercicio:
      2024: milhoes
    # cabeçalho dos metadados (PDF). O CSV real (9/nov/2026) traz os mesmos campos em maiúsculas, sem acento e com nomes
    # curtos (ANO, AJUSTE METODOLOGICO, ACAO GOVERNO, UNIDADE ORCAMENTARIA, CLASSIFICACAO ECONOMICA GFS, ... DESCRICAO)
    colunas: [Ano de Lançamento, Ajustes Metodológicos, Natureza Despesa Detalhada, Natureza Despesa Detalhada - Descrição,
              Ação Governo - Código, Ação Governo - Descrição, Unidade Orçamentária - Código, Unidade Orçamentária - Descrição,
              Classificação Econômica GFS - Código, Classificação Econômica GFS - Descrição, Classificação COFOG,
              Classificação COFOG - Descrição, Valor (R$)]
    usos: [mart cofog (produto separado do recibo): régua das dez divisões, ajustes do Tesouro, ponte com o total do recibo]

  - id: S8
    nome: SIOP, orçamento federal por classificador (inclui marcador de emendas RP 6/7/8)
    orgao: Ministério do Planejamento
    base_url: https://www1.siop.planejamento.gov.br/sparql/
    formato: sparql/json (Virtuoso; um grafo por exercício; valores em R$ inteiros)
    cadencia: contínua (o grafo publica loa:dataUltimaAtualizacao; o fetcher só refaz o exercício quando ela muda)
    cobertura: desde 2000 (a confirmar); usamos 2024 em diante
    chave: nenhuma
    camada: api
    status: implementado
    fetcher: siop
    grafo: "http://orcamento.dados.gov.br/{exercicio}/"
    vocabulario: "http://vocab.e.gov.br/2013/09/loa#"   # confirmado em 2026-11-08 listando os predicados do grafo de 2025
    timeout_ms: 0                                        # parâmetro `timeout` do Virtuoso (0 = padrão do servidor)
    timeout_http_s: 300                                  # as fatias grandes (elemento x órgão da função 28) podem levar dezenas de segundos
    # Rolagem como o RREO monta a linha XII do Anexo 01: GND 6 com fonte cujo código termina em 443 ("Refinanciamento da
    # Dívida Pública Federal"; o primeiro dígito é o indicador de exercício: 1 corrente, 3 condicionado...). Confirmado em
    # 2025: R$ 1.417,6 bi nas duas fontes, ao bilhão. A fonte 444 ("Demais Aplicações" dos títulos) não é rolagem.
    fontes_refinanciamento: ["443"]
    exercicios_padrao: [2024, 2025, 2026]
    notas: >
      Acesso documentado pelo pacote oficial orcamentobr (Ministério do Planejamento; GPL-3, por isso usamos só o
      modelo de dados, que é público). TLS OK com curl em 2026-11-08; se o Python reclamar da cadeia, RECIBO_CA_BUNDLE
      com a cadeia Sectigo, nunca desligar verificação. Sem teto de linhas até 20 mil (testado); o fetcher avisa se uma
      resposta vier com exatamente 10 mil. Não tem restos a pagar pagos (isso é o COFOG, S7).
    # Cada agregação vira uma consulta SPARQL (SUM dos valores por combinação de códigos). As grandes são fatiadas por
    # função (uma consulta por função). esfera e modalidade entram em todas: é o que separa o universo comparável ao
    # RREO (orçamentos fiscal e da seguridade, sem a modalidade 91, intraorçamentária).
    agregacoes:
      - id: fonte_gnd_subfuncao
        dimensoes: [esfera, modalidade_aplicacao, funcao, subfuncao, gnd, fonte]
        fatiar_por_funcao: false
        descricao: grupo de despesa por subfunção, com a fonte de recursos (identifica o refinanciamento como o RREO faz)
      - id: elemento_orgao
        dimensoes: [esfera, modalidade_aplicacao, orgao, funcao, subfuncao, gnd, elemento_despesa]
        fatiar_por_funcao: true
        descricao: elemento de despesa por órgão (01 aposentadorias e reformas, 03 pensões, 11 vencimentos, 91 sentenças judiciais)
      - id: rp_subfuncao
        dimensoes: [esfera, modalidade_aplicacao, funcao, subfuncao, gnd, resultado_primario]
        fatiar_por_funcao: false
        descricao: identificador de resultado primário (RP 6, 7 e 8 = emendas; 0 = financeira) por subfunção
      - id: acao_subfuncao
        dimensoes: [esfera, modalidade_aplicacao, funcao, subfuncao, gnd, acao]
        fatiar_por_funcao: true
        descricao: ação por subfunção (abre a 846; nomeia o serviço da dívida fora de 843/844)
      - id: acao_rp_subfuncao
        dimensoes: [esfera, modalidade_aplicacao, funcao, subfuncao, gnd, resultado_primario, acao]
        fatiar_por_funcao: true
        descricao: ação com identificador de resultado primário (lista o que foi emprestado, GND 5 com RP 0, por linha e no total; emendas por ação)
    usos: [conferência cruzada com o RREO, serviço da dívida fora de 843/844 por ação, inativos por elemento, chip emendas, chip investimento, folha de ativos, empréstimos fora do R$ 1,00 (GND 5 com RP 0) por linha e por ação]

