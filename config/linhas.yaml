    indexador_prefixado: 4178
    indexador_cambio: 4173
    prazo_medio: 10618
  reconciliacoes:
    - id: dpf_fatores_identidade
      descricao: >
        Estoque anterior + emissões + resgates + juros apropriados + operações com o BC = estoque no fim do ano
        (planilha de fatores do Tesouro, R$ milhões). É a conta do próprio Tesouro de por que a dívida variou.
      critica: true
      tolerancia_relativa: 0.000001
    - id: fatores_coluna_anual_vs_soma_meses
      descricao: >
        Nos juros apropriados, a coluna anual que o Tesouro publica na planilha de fatores é igual à soma dos doze
        meses (só em ano fechado).
      critica: false
      tolerancia_relativa: 0.000000001
    - id: dpf_estoque_xlsx_vs_csv
      descricao: >
        DPF em poder do público no fim do ano: a planilha do Tesouro (R$ bilhões) e o CSV título a título (reais,
        carteira Mercado) são o mesmo número.
      critica: true
      tolerancia_relativa: 0.000001
    - id: dpf_estoque_xlsx_vs_fatores
      descricao: >
        Estoque no fim do ano igual nas duas planilhas do Tesouro (estoque 2.1 em bilhões, fatores 2.9 em milhões).
      critica: true
      tolerancia_relativa: 0.000001
    - id: carteira_bc_tesouro_vs_bcb
      descricao: >
        Títulos do Tesouro na carteira do Banco Central: o CSV do Tesouro (reais) e a série 4152 do BC (R$ milhões,
        duas casas) no fim do ano.
      critica: false
      tolerancia_relativa: 0.000001
    - id: dpmfi_mercado_tesouro_vs_bcb
      descricao: >
        Dívida mobiliária interna em mercado: Tesouro (DPMFi) contra a série 4154 do BC. Em 2023 e 2024 o BC traz
        R$ 26 a 29 milhões a mais em 7 trilhões (0,0004%).
      critica: false
      tolerancia_relativa: 0.0001
    - id: juros_anexo01_vs_execucao_dpf
      descricao: >
        Juros pagos no ano: a linha de juros do recibo (Anexo 01, liquidado) contra a execução da DPF por natureza
        (grupo 2, juros e encargos, inclusive a cobertura do BC). Em 2023 iguais a R$ 10 mil; em 2024, R$ 55 milhões de
        diferença (72 milhões são o cacau, ação 00QM, que não é DPF).
      critica: false
      tolerancia_relativa: 0.001
    - id: principal_anexo01_vs_execucao_dpf
      descricao: >
        Amortização mais refinanciamento do Anexo 01 contra o principal pago na execução da DPF (grupo 6).
      critica: false
      tolerancia_relativa: 0.001
    - id: cobertura_bc_execucao_vs_recibo
      descricao: >
        O que o recibo mede como serviço da dívida fora das subfunções 843/844 (juros + amortização - 843/844) contra
        as linhas "Política Monetária" da execução da DPF (cobertura do resultado negativo do BC, ação 0669), contadas
        uma vez. A diferença conhecida é o cacau (00QM): 72 milhões em 2024. Em 2023 os dois lados são zero (o recibo
        dá -2,26 reais, arredondamento do RREO); o piso de tolerância é o das identidades sobre juros + amortização.
      critica: false
      tolerancia_relativa: 0.01
    - id: titulos_rreo_vs_emissoes_dpf
      descricao: >
        Títulos vendidos no ano pelo RREO (receitas de operações de crédito mais refinanciamento, Anexo 01) contra as
        emissões da DPF em poder do público (fatores de variação do Tesouro, Anexo 2.9). Medem coisas parecidas, não
        iguais: o RREO registra a receita orçamentária de todo título emitido (inclusive os emitidos direto para a
        carteira do Banco Central, como a cobertura do resultado negativo do BC) e os fatores só as emissões em mercado.
        Em 2025: R$ 2,46 tri contra R$ 1,90 tri. A diferença está em investigação (página Perguntas abertas); a
        conferência é informativa e a tolerância é só para registrar o tamanho dela, não para aprovar.
      critica: false
      tolerancia_relativa: 0.0001
    - id: indexador_selic_tesouro_vs_bcb
      descricao: >
        Fatia da dívida mobiliária interna em mercado atrelada à Selic: LFT sobre DPMFi no CSV do Tesouro contra a
        série 4177 do BC (participação por indexador, posição em carteira). Pontos percentuais.
      critica: false
      tolerancia_absoluta: 0.05
    - id: indexador_prefixado_tesouro_vs_bcb
      descricao: >
        Fatia prefixada: LTN mais NTN-F sobre DPMFi contra a série 4178 do BC. Pontos percentuais.
      critica: false
      tolerancia_absoluta: 0.05
  glossario:
    - termo: DPF, DPMFi e DPFe
      texto: >
        DPF é a Dívida Pública Federal: tudo o que o Tesouro deve, em títulos e contratos. DPMFi é a parte interna em
        títulos (a maior); DPFe é a parte externa, em dólar, euro e contratos com organismos internacionais.
    - termo: em poder do público e carteira do Banco Central
      texto: >
        O Tesouro também tem títulos na mão do Banco Central, que os usa para controlar a quantidade de dinheiro na
        economia. "Em poder do público" (ou "em mercado") é a dívida fora do BC; é a que o Tesouro chama de DPF.
    - termo: juros apropriados
      texto: >
        Os juros que o estoque gerou no mês, pagos ou não. A dívida cresce por eles mesmo sem nenhum pagamento. Na
        externa, inclui a variação do câmbio.
    - termo: juros nominais pelo BC (NFSP)
      texto: >
        NFSP são as "necessidades de financiamento do setor público", a conta do Banco Central que mede o déficit pelo
        que a dívida precisou crescer. Os juros nominais dessa conta são líquidos: juros devidos menos juros que o
        governo recebeu (do caixa aplicado, de quem lhe deve). Por isso são menores que os brutos do Anexo 06.
    - termo: dívida líquida e dívida bruta
      texto: >
        Bruta é o que o governo deve. Líquida é o que deve menos o que tem a receber e o que tem em caixa. O BC publica
        as duas; a bruta do governo geral (União, estados e municípios, em % do PIB) é a mais citada.
    - termo: dívida consolidada (RREO)
      texto: >
        A medida da Lei de Responsabilidade Fiscal, no Anexo 06 do RREO: consolidada (bruta) e consolidada líquida
        (descontados caixa e haveres). A variação da líquida é o que o RREO chama de resultado nominal "abaixo da linha".
    - termo: prazo médio e vincendo em 12 meses
      texto: >
        Prazo médio é quanto tempo, em média, falta para a dívida vencer. "Vincendo em 12 meses" é a fatia que vence no
        próximo ano e precisa ser paga ou rolada (trocada por dívida nova). Quanto maior, mais o Tesouro depende do
        humor do mercado nos próximos meses. Aqui a fatia conta só o principal dos títulos e contratos que vencem no
        período; o Tesouro, no Relatório Mensal da Dívida, conta também os juros (cupons) que caem nesses meses, trazidos
        a valor presente, e por isso publica um número maior. O prazo médio mostrado é o do Banco Central (série 10618,
        dívida mobiliária interna em mercado); o do Tesouro, para a DPF inteira, está só no Relatório Mensal (PDF).
    - termo: indexador
      texto: >
        A que cada título está preso: à Selic (LFT, sobe quando o juro sobe), prefixado (LTN e NTN-F, juro combinado na
        emissão; também o Global BRL, título externo emitido em reais), a um índice de preços (NTN-B, inflação mais juro)
        ou ao câmbio (dívida externa em dólar, euro e outras moedas). Aqui a classificação é pelo nome do título; o
        Tesouro classifica cada papel pelo indexador do contrato, por isso as fatias do Relatório Mensal diferem em até
        0,1 ponto percentual.
