# Planilha-mãe como código (v0.8.0: RREO + SIOP no recibo, total pela conta oficial do Tesouro, receitas e memos; os
# blocos `cofog` e `divida` no fim são produtos separados e não alteram nenhum número do recibo; `populacao` é a
# régua do per capita, que só entra em memos).
# Cada entrada gera, ao mesmo tempo: o SQL que calcula o número, a ficha técnica publicada e as reconciliações.
# Mudou aqui, mudou nos três. Nenhum valor é digitado neste arquivo.
# Calibrado em 2026-11-08/09 contra o RREO da União (2023/6º, 2024/6º, 2025/6º e 2026/4º bimestre) e o SIOP
# (2023 a 2026). Os valores citados nos comentários são observações dessas rodadas, não entradas.

versao: "0.10.0"   # números do recibo iguais aos da 0.5.1; 0.6.3 acrescentou o bloco `cofog`, 0.7.2 o bloco `divida` (marts separados), 0.8.0 o bloco `populacao` (per capita, só memos), 0.9.0 os níveis por linha no export (site), 0.9.1 o bloco `fontes_de_recursos`, 0.10.0 `estoque_detalhe`, `conta_do_ano` e `estoque_mensal` na dívida

regra_rateio: >
  O imposto é fungível: cada R$ 1,00 arrecadado é rateado na proporção do que o governo gastou no período. "Gastou"
  é a conta oficial do Tesouro: a despesa primária do Anexo 06 do RREO (salários, aposentadorias, benefícios,
  custeio, obras, repasses; liquidada), mais os juros da dívida pagos (Anexo 01). Fica fora do R$ 1,00 o que não é
  gasto e sim troca de ativo: refinanciamento e amortização da dívida (pagar o principal) e o que o Tesouro
  classifica como financeiro (emprestar, comprar título, integralizar capital com retorno). As linhas somam
  R$ 1,00. O que saiu do caixa como empréstimo aparece no "Fora do R$ 1,00", com a lista do que foi emprestado; o
  que foi gasto além do arrecadado aparece como memo (resultado primário), nunca dentro do R$ 1,00.

metrica:
  descricao: Despesas liquidadas até o bimestre (no 6º bimestre, o exercício inteiro), exceto intraorçamentárias.
  coluna_regex: "LIQUIDADAS.*ATE O BIMESTRE"
  escopo: exceto_intra
  nota: >
    O RREO não traz "pago" por função; liquidado é o estágio mais próximo da execução. Liquidado no exercício
    subestima investimento (boa parte paga via restos a pagar): no ano fechado, a fonte definitiva passa a ser o
    COFOG (S7: liquidado + restos a pagar pagos) e esta métrica vira preliminar. O memo restos_a_pagar mostra o
    tamanho disso pelo Anexo 06.

bases:
  anexo02_subfuncao:
    fonte: S4
    dataset: siconfi_rreo
    anexo_regex: "^RREO-ANEXO 0?2$"
    nivel: subfuncao
    usa_escopo: true
    descricao: >
      Linhas de subfunção do Anexo 02 (despesa por função/subfunção). A partição é por subfunção, não por função,
      porque a função 09 "Previdência Social" não é o INSS (contém RPPS e administração). A União lista as
      subfunções típicas de cada função pelo nome e agrega as atípicas em "FUxx - Demais Subfunções".
  anexo01_conta:
    fonte: S4
    dataset: siconfi_rreo
    anexo_regex: "^RREO-ANEXO 0?1$"
    nivel: null
    usa_escopo: false
    descricao: >
      Contas do Anexo 01 (balanço orçamentário), selecionadas por cod_conta, que é estável e já distingue
      as linhas intraorçamentárias (sufixo "Intra"). Despesas na coluna da métrica; receitas na coluna
      "ATE O BIMESTRE (C)" (receitas realizadas até o bimestre), ver referencias_anexo01_receitas.
  anexo06_conta:
    fonte: S4
    dataset: siconfi_rreo
    anexo_regex: "^RREO-ANEXO 0?6$"
    nivel: null
    usa_escopo: false
    descricao: >
      Contas do Anexo 06 (demonstrativo dos resultados primário e nominal), selecionadas por cod_conta. É a conta
      oficial do Tesouro de "quanto o governo arrecadou e gastou" fora a dívida. A coluna muda conforme a medida
      (receitas realizadas, despesas liquidadas, pagas, restos a pagar pagos, VALOR, VALOR INCORRIDO, saldos da
      dívida) e é dita em cada uso (anexo06.colunas).
  siop_elemento:
    fonte: S8
    dataset: siop_execucao
    fonte_valor: siop
    agregacao: elemento_orgao
    medida: liquidado          # a mesma métrica do recibo (despesa liquidada no exercício)
    universo: "ofss AND NOT intra"
    descricao: >
      Execução do SIOP por elemento de despesa, órgão, função, subfunção e GND, no mesmo universo do RREO (orçamentos
      fiscal e da seguridade, sem intraorçamentárias). Só vale para ano fechado: o SIOP é acumulado até a última
      atualização, o RREO até o bimestre. Os filtros usam funcao_cod e subfuncao_cod como no Anexo 02 (a view
      siop_lin dá esses nomes às colunas do SIOP), por isso a mesma regra de uma linha do RREO pode ser aplicada ao SIOP.
  siop_gnd:
    fonte: S8
    dataset: siop_execucao
    fonte_valor: siop
    agregacao: fonte_gnd_subfuncao
    medida: liquidado
    universo: "ofss AND NOT intra"
    descricao: Execução do SIOP por grupo de despesa, fonte, função e subfunção, no universo do RREO. Base do chip de investimento.
  siop_rp:
    fonte: S8
    dataset: siop_execucao
    fonte_valor: siop
    agregacao: rp_subfuncao
    medida: liquidado
    universo: "ofss AND NOT intra"
    descricao: >
      Execução do SIOP por identificador de resultado primário (RP), grupo, função e subfunção, no universo do RREO.
      Base do chip de emendas (RP 6 a 9) e da atribuição por linha dos empréstimos (GND 5 com RP 0).

# cod_conta do Anexo 01 usados em linhas e reconciliações (observados em 2024/6), na coluna da métrica (despesas).
referencias_anexo01:
  total_exceto_intra: DespesasExcetoIntraOrcamentarias
  juros: JurosEEncargosDaDivida
  amortizacao: AmortizacaoDaDivida
  refinanciamento: AmortizacaoRefinanciamentoDaDivida
  beneficios_previdenciarios: BeneficiosPrevidenciarios
  pessoal: PessoalEEncargosSociais
  outras_correntes: OutrasDespesasCorrentes
  investimentos: Investimentos
  inversoes_financeiras: InversoesFinanceiras
  transferencias_modalidade: TransferenciasAEstadosDistritoFederalEMunicipios

# Receitas do Anexo 01 (balanço orçamentário), coluna "ATE O BIMESTRE (C)" = receitas realizadas até o bimestre.
# Observado em 2024/6 e 2025/6: a hierarquia fecha ao centavo (correntes + capital = exceto intra (I)). Os dois
# últimos códigos são longos e o inspect os corta em 34 caracteres: por isso vão por prefixo (nunca casa "Intra").
referencias_anexo01_receitas:
  coluna_regex: "^ATE O BIMESTRE"
  contas:
    receitas_exceto_intra: ReceitasExcetoIntraOrcamentarias   # (I)
    correntes: ReceitasCorrentes
    tributaria: ReceitaTributaria                              # impostos, taxas e contribuições de melhoria
    impostos: Impostos
    taxas: Taxas
    contribuicoes: ReceitaDeContribuicoes
    contribuicoes_sociais: ContribuicoesSociais
    patrimonial: ReceitaPatrimonial
    agropecuaria: ReceitaAgropecuaria
    industrial: ReceitaIndustrial
    servicos: ReceitaDeServicos
    transferencias_correntes: TransferenciasCorrentes
    outras_correntes: OutrasReceitasCorrentes
    a_classificar: ReceitasCorrentesAClassificar
    capital: ReceitasDeCapital
    operacoes_credito: ReceitasDeOperacoesDeCredito            # títulos vendidos além da rolagem (dívida nova)
    alienacao_bens: AlienacaoDeBens
    amortizacoes_emprestimos: AmortizacoesDeEmprestimos        # o que tomadores devolveram ao Tesouro
    transferencias_capital: TransferenciasDeCapital
    outras_capital: OutrasReceitasDeCapital
    remuneracao_caixa: {prefixo: RemuneracaoDasDisponibilidadesDoTe}   # rendimento do caixa do Tesouro no Banco Central
    resultado_bc: {prefixo: ResultadoDoBancoCentralDoBrasil}           # resultado do Banco Central repassado (linha nova em 2025)
    refinanciamento: OperacoesDeCreditoRefinanciamento         # (IV) rolagem: não é receita nova
    total: TotalReceitas                                       # (V)
    deficit: Deficit                                           # (VII) só existe quando a despesa total supera a receita total

# Anexo 06 (resultados primário e nominal) da União: cod_conta por grupo e as colunas de cada grupo. Chaves no código:
# "conta:coluna" (ex.: pessoal:liquidadas, primario_acima:valor, divida_liquida:saldo_final). Observado em 2023/6 a
# 2026/4: as identidades (I = soma das receitas correntes; VII = IV + V + VI; IX = III - pagas - restos pagos + ajuste)
# fecham ao centavo. O ajuste metodológico só existe em 2025 e 2026. Pessoal e investimentos do Anexo 06 são iguais
# aos do Anexo 01; outras despesas correntes diferem em R$ 0,45 bi (2025) e inversões financeiras em R$ 128,4 bi:
# é o que o Tesouro trata como financeiro, e é o que fica fora do R$ 1,00.
anexo06:
  base: anexo06_conta
  colunas:
    previsao: "^PREVISAO ATUALIZADA"
    realizadas: "^RECEITAS REALIZADAS"
    dotacao: "^DOTACAO ATUALIZADA"
    empenhadas: "^DESPESAS EMPENHADAS"
    liquidadas: "^DESPESAS LIQUIDADAS"
    pagas: "^DESPESAS PAGAS"
    rp_processados_pagos: "^RESTOS A PAGAR PROCESSADOS PAGOS"
    rpnp_liquidados: "^LIQUIDADOS"
    rpnp_pagos: "^PAGOS"
    valor: "^VALOR$"
    valor_incorrido: "^VALOR INCORRIDO"
    saldo_inicial: "^EM 31/12/"
    saldo_final: "^ATE O BIMESTRE"
  grupos:
    receitas:
      colunas: [realizadas, previsao]
      contas:
        receitas_correntes: ReceitasPrimariasCorrentes             # (I); sem o prefixo RREO6, como a API devolve
        tributarias: RREO6ReceitasTributarias                      # impostos, taxas e contribuições de melhoria
        contribuicoes: RREO6ReceitasDeContribuicoes
        patrimonial: RREO6ReceitaPatrimonial
        transferencias_correntes: RREO6TransferenciasCorrentes
        demais_correntes: RREO6DemaisReceitasCorrentes
        receitas_capital: RREO6ReceitasPrimariasDeCapital          # (II)
        alienacao_bens: RREO6AlienacaoDeBens
        transferencias_capital: RREO6TransferenciasDeCapital
        outras_capital: RREO6OutrasReceitasDeCapital               # só apareceu em 2026
        receita_primaria_total: RREO6TotalReceitaPrimaria          # (III) = (I) + (II)
    despesas:
      colunas: [liquidadas, pagas, empenhadas, dotacao, rp_processados_pagos, rpnp_liquidados, rpnp_pagos]
      contas:
        despesas_correntes: RREO6DespesasPrimariasCorrentes        # (IV)
        pessoal: RREO6PessoalEEncargosSociais
        outras_correntes: RREO6OutrasDespesasCorrentes
        transferencias_constitucionais: RREO6TransferenciasConstitucionaisELegais
        demais_despesas_correntes: RREO6DemaisDespesasCorrentes
        despesas_capital: RREO6DespesasPrimariasDeCapital          # (V)
        investimentos: RREO6Investimentos
        inversoes: RREO6InversoesFinanceiras                       # só a parte que o Tesouro conta como gasto
        reserva_contingencia: RREO6ReservaDeContingencia           # (VI) só dotação
        despesa_primaria_total: RREO6TotalDespesaPrimaria          # (VII) = (IV) + (V) + (VI); numerada (VIII) em 2023 e 2024
    resultados:
      colunas: [valor]
      contas:
        primario_acima: RREO6ResultadoPrimarioEstadosMunicipios    # "RESULTADO PRIMÁRIO - Acima da Linha (IX)": é esse o cod_conta no RREO da União
        ajuste_metodologico: RREO6AjusteMetodologicoDoResultadoPrimarioAcimaDaLinha   # existe a partir de 2025
        primario_abaixo: ResultadoPrimarioAbaixoDaLinha            # (XXVII), pela variação da dívida consolidada líquida do RREO (não é a conta do BC)
        nominal_acima: ResultadoNominalAcimaDaLinha                # (XII) = IX + (X - XI)
        nominal_abaixo: ResultadoNominalAbaixoDaLinha              # (XVII)
        nominal_ajustado: ResultadoNominalAjustado                 # (XXVI)
        variacao_saldo_rpp: VariacaoSaldoRPP                       # (XVIII)
        passivos_reconhecidos: PassivosReconhecidosNaDC            # (XX)
        outros_ajustes: OutrosAjustes                              # (XXV)
    juros:
      colunas: [valor_incorrido]
      contas:
        juros_ativos: JurosEEncargosAtivos                         # (X) juros que o governo recebeu
        juros_passivos: JurosEEncargosPassivos                     # (XI) juros que a dívida gerou (competência)
    divida:
      colunas: [saldo_inicial, saldo_final]
      contas:
        divida_consolidada: DividaConsolidada                      # (XIII)
        deducoes: DeducoesDaDividaConsolidada                      # (XIV) caixa e haveres
        caixa_bruta: DisponibilidadeDeCaixaBruta
        rp_processados_deducao: RestosAPagarProcessadosExcetoPrecatorios
        demais_haveres: DemaisHaveresFinanceiros
        divida_liquida: DividaConsolidadaLiquida                   # (XVI) = XIII - XIV

# Ajustes metodológicos declarados (cada um é uma decisão, não um detalhe de código).
ajustes:
  # Juros (GND 2) + amortização (GND 6) do Anexo 01 excedem as subfunções 843/844 (serviço da dívida): em 2024/6,
  # R$ 40,8 bi (1,2% da despesa exceto intra); em 2025, R$ 124,0 bi (3,3%); em 2023 e em 2026/4, zero. Confirmado
  # no SIOP (v0.2.0, por ação): é a ação 0669 "Cobertura do Resultado Negativo Apurado no Banco Central do Brasil"
  # (Lei 13.820/2019), classificada na 846 (Outros Encargos Especiais), que cai no residual: R$ 36,5 bi de
  # amortização + R$ 4,2 bi de juros em 2024; R$ 111,2 bi + R$ 12,8 bi em 2025. Sem o ajuste, esses juros seriam
  # contados duas vezes (na linha de juros e no residual) e essa amortização entraria como gasto. Com o ajuste, o
  # residual é reduzido nesse valor e vale a identidade: soma das linhas = despesa primária do Anexo 06 + juros do
  # Anexo 01. A conferência servico_divida_fora_843_844_siop (crítica) mede o mesmo valor no SIOP e nomeia as ações;
  # ela é o que transforma o ajuste em valor nomeado.
  servico_divida_fora_843_844: true

linhas:
  - id: previdencia_inss
    nome: Previdência (INSS)
    definicao: "Benefícios do Regime Geral (trabalhadores do setor privado): subfunção 271 Previdência Básica, em qualquer função."
    base: anexo02_subfuncao
    filtro: "subfuncao_cod = '271'"

  - id: inativos_pensionistas
    nome: Aposentados e pensionistas do setor público
    definicao: >
      Aposentadorias, reservas remuneradas, reformas e pensões pagas pela União a servidores civis e militares e
      seus dependentes: elementos de despesa 01 (aposentadorias do RPPS, reserva remunerada e reformas dos militares)
      e 03 (pensões), em qualquer função e qualquer órgão, no SIOP. Pela função/subfunção do RREO isso não se vê:
      em 2025 só R$ 103,5 bi dos R$ 179,7 bi estavam na subfunção 272; o resto estava em Defesa (reserva e reforma
      dos militares, R$ 34,2 bi), em Encargos Especiais (pensões militares, R$ 30,4 bi; movidas da função 09 para a
      28 em 2025) e em Transferências (inativos do Fundo Constitucional do DF, R$ 10,4 bi). O que o SIOP encontra
      dentro de uma linha do RREO sai dela e entra aqui (transferências declaradas na ficha); o total do recibo não
      muda. Em ano em andamento, ou sem SIOP, vale o fallback do RREO, marcado como piso.
    base: siop_elemento
    filtro: "cod_elemento_despesa IN ('01', '03')"
    transfere_de_linhas: true
    fallback:
      base: anexo02_subfuncao
      filtro: "subfuncao_cod IN ('272', '274')"
      nota: >
        piso: subfunções 272 e 274 do RREO. O valor completo (elementos 01 e 03 do SIOP, em qualquer função) só é
        calculado em ano fechado; em 2025 ele foi 72% maior que o piso.

  - id: assistencia
    nome: Assistência social (Bolsa Família, BPC)
    definicao: Função 08, excluídas as subfunções previdenciárias.
    base: anexo02_subfuncao
    filtro: "funcao_cod = '08' AND COALESCE(subfuncao_cod, '') NOT IN ('271', '272', '274')"

  - id: saude
    nome: Saúde
    definicao: Função 10 (inclui repasses do SUS a estados e municípios), excluídas as subfunções previdenciárias.
    base: anexo02_subfuncao
    filtro: "funcao_cod = '10' AND COALESCE(subfuncao_cod, '') NOT IN ('271', '272', '274')"

  - id: educacao
    nome: Educação
    definicao: >
      Função 12, excluídas as subfunções previdenciárias. A complementação do FUNDEB e o salário-educação
      (subfunção 847, atípica para a função) já estão dentro de "FU12 - Demais Subfunções"; a cláusula sobre 847
      cobre o caso de a União passar a detalhá-la em outra função.
    base: anexo02_subfuncao
    filtro: "(funcao_cod = '12' AND COALESCE(subfuncao_cod, '') NOT IN ('271', '272', '274')) OR subfuncao_cod = '847'"

  - id: trabalho
    nome: Trabalho (abono, seguro-desemprego)
    definicao: Função 11, excluídas as subfunções previdenciárias.
    base: anexo02_subfuncao
    filtro: "funcao_cod = '11' AND COALESCE(subfuncao_cod, '') NOT IN ('271', '272', '274')"

  - id: defesa_seguranca
    nome: Defesa e segurança
    definicao: >
      Funções 05 e 06, excluídas as subfunções previdenciárias explícitas. Atenção: inativos e pensionistas
      militares podem estar classificados dentro desta função (ver limitação da linha de aposentados).
    base: anexo02_subfuncao
    filtro: "funcao_cod IN ('05', '06') AND COALESCE(subfuncao_cod, '') NOT IN ('271', '272', '274')"

  - id: transferencias
    nome: Transferências a estados e municípios
    definicao: >
      Subfunção 845 (FPM, FPE e demais repartições de receita classificadas em Encargos Especiais). Repasses do
      SUS e do FUNDEB não entram aqui: contam como Saúde e Educação, por desenho.
    base: anexo02_subfuncao
    filtro: "subfuncao_cod = '845'"

  - id: juros
    nome: Juros da dívida
    definicao: >
      Juros e encargos da dívida (grupo de despesa) do Anexo 01, cod_conta JurosEEncargosDaDivida: o que foi pago
      em dinheiro no período. Substitui as subfunções 843/844 do Anexo 02, que misturam juros e amortização. Os
      juros que a dívida gerou no período (competência, Anexo 06) são bem maiores e estão no memo juros_nominais.
    base: anexo01_conta
    filtro: "cod_conta = 'JurosEEncargosDaDivida'"

  - id: maquina_demais
    nome: Encargos especiais e demais funções
    definicao: >
      Tudo o que sobra do Anexo 02 (exceto intraorçamentárias) depois das linhas acima, das exclusões (serviço da
      dívida, empréstimos e aplicações financeiras) e do ajuste do serviço da dívida fora de 843/844. Em 2025: a
      subfunção 846 "Outros Encargos Especiais" sem a cobertura do Banco Central, sem as pensões militares (linha de
      aposentados) e sem os empréstimos (fora do R$ 1,00): sentenças judiciais e precatórios (R$ 77 bi), subvenções
      e honras de aval; os repasses aos fundos constitucionais FNE, FNO e FCO (R$ 27,6 bi), que a lei orçamentária
      carimba como financeiros e o Tesouro conta como gasto; e todas as outras funções juntas (Judiciário,
      Legislativo, Essencial à Justiça, Administração, Agricultura, Ciência, Gestão ambiental, Transporte, Relações
      exteriores e as pequenas), também sem os seus empréstimos (Fundo Clima, FNDCT, dívidas rurais). O hover abre a
      846 por ação, pelo SIOP.
    base: anexo02_subfuncao
    residual: true

excluidos:
  - id: refinanciamento
    nome: Refinanciamento da dívida (rolagem) no Anexo 02
    motivo: >
      Troca de título vencido por título novo. Não consome imposto, e somar giro é dupla contagem
      (regra editorial 3). No RREO da União o total do Anexo 02 já exclui o refinanciamento (ele aparece só
      na linha XII do Anexo 01), então esta exclusão tende a zero; fica como salvaguarda. O valor exibido ao
      público vem do Anexo 01 (referencias_anexo01.refinanciamento).
    base: anexo02_subfuncao
    filtro: "subfuncao_cod IN ('841', '842')"

  - id: servico_divida_bruto
    nome: Serviço da dívida (juros + amortização) no Anexo 02
    motivo: >
      As subfunções 843/844 misturam juros e amortização. Os juros entram pela linha própria (Anexo 01);
      a amortização é operação de estoque e fica fora do R$ 1,00. O valor de amortização publicado é o do
      Anexo 01 (AmortizacaoDaDivida); a parte dele que não está em 843/844 é removida do residual
      (ajustes.servico_divida_fora_843_844).
    base: anexo02_subfuncao
    filtro: "subfuncao_cod IN ('843', '844')"

  # Exclusão pela conta do Tesouro (calculo: tesouro). O valor é uma diferença, não uma soma de linhas:
  #   despesa exceto intra (Anexo 02) - AmortizacaoDaDivida (Anexo 01) - despesa primária liquidada (Anexo 06) - juros (Anexo 01).
  # Por grupo de despesa, é Anexo 01 menos a parte primária do Anexo 06 (por_grupo). Por linha, o que sai de cada
  # linha nomeada é o GND 5 com RP 0 do SIOP (ano fechado; por_linha); o resto sai do resíduo. Em ano em andamento,
  # ou sem SIOP, o total continua exato (Anexo 06) e tudo sai do resíduo, com avisos nas linhas (avisos_sem_siop).
  - id: emprestimos_financeiros
    nome: Empréstimos e aplicações financeiras do Tesouro
    motivo: >
      Dinheiro que saiu do caixa mas não foi gasto: virou um direito de receber de volta (empréstimo a empresa,
      estudante, banco público ou fundo que empresta; compra de título; capital em empresa estatal com retorno). É
      como pagar o principal da dívida: sai dinheiro, não é consumo. O tamanho vem da conta oficial do Tesouro: é a
      diferença entre a despesa do RREO (Anexo 02, sem amortização) e a despesa primária do Anexo 06 mais os juros.
      Em 2025, R$ 128,8 bi (R$ 128,4 bi em inversões financeiras, grupo 5; R$ 0,45 bi em outras despesas correntes,
      grupo 3). Por linha, usamos o carimbo da lei orçamentária (grupo 5 com identificador de resultado primário 0)
      no SIOP: o FAT emprestado ao BNDES sai de Trabalho (R$ 28,9 bi em 2025), o FIES sai de Educação (R$ 5,6 bi), e
      o resto sai da linha "Encargos especiais e demais funções". Onde a lei carimba como financeiro e o Tesouro conta
      como gasto (R$ 31,9 bi em 2025, dos quais R$ 27,6 bi são os repasses aos fundos constitucionais FNE, FNO e
      FCO: 3% do IR e do IPI que a Constituição manda entregar e que não voltam ao Tesouro), o valor fica dentro do
      R$ 1,00, nessa mesma linha, com a diferença declarada. A própria LDO (art. 7º, §4º) diz que o carimbo serve
      para "auxiliar a apuração do resultado primário" pela metodologia do Tesouro: o número oficial é o do Tesouro.
      O que não voltar vira gasto no ano em que for perdoado (balanço patrimonial, não orçamento). O subsídio
      embutido (juro abaixo do mercado) já está no R$ 1,00, como equalização (grupo 3).
    base: anexo06_conta
    calculo: tesouro
    por_grupo:                       # grupo -> (referencias_anexo01, anexo06.grupos.despesas, coluna liquidadas)
      pessoal: {anexo01: pessoal, anexo06: pessoal}
      outras_despesas_correntes: {anexo01: outras_correntes, anexo06: outras_correntes}
      investimentos: {anexo01: investimentos, anexo06: investimentos}
      inversoes_financeiras: {anexo01: inversoes_financeiras, anexo06: inversoes}
    por_linha:
      base: siop_rp
      filtro: "cod_gnd = '5' AND cod_resultado_primario = '0'"
    lei_vs_tesouro:
      grupo: inversoes_financeiras   # a comparação lei (RP 0 do SIOP) x Tesouro (por_grupo) é feita no grupo 5
      fundos_constitucionais:
        nome: Fundos constitucionais de financiamento do Nordeste, Norte e Centro-Oeste (FNE, FNO, FCO)
        acoes: ["0029", "0030", "0031", "0534"]   # 0029 FCO; 0030 e 0031 FNE (semiárido e demais); 0534 FNO. Função 28, subfunção 846.
        nota: >
          A Constituição (art. 159, I, c) manda entregar 3% do IR e do IPI a esses fundos, que emprestam a empresas e
          produtores das três regiões. A lei orçamentária carimba o repasse como financeiro (grupo 5, RP 0); o
          Tesouro o trata como repartição de receita, igual ao FPM, e conta como gasto. Fica dentro do R$ 1,00.
    nota_sem_siop: >
      total exato pelo Anexo 06; sem detalhe por linha neste período (o SIOP só é comparável em ano fechado): tudo
      sai da linha "Encargos especiais e demais funções".
    avisos_sem_siop:
      - linha: trabalho
        nota: >
          inclui, até o fechamento do ano, o FAT emprestado ao BNDES (grupo 5, RP 0; R$ 28,9 bi em 2025), que
          em ano fechado sai desta linha para o "Fora do R$ 1,00"
      - linha: educacao
        nota: >
          inclui, até o fechamento do ano, o financiamento estudantil FIES (grupo 5, RP 0; R$ 5,6 bi em 2025), que
          em ano fechado sai desta linha para o "Fora do R$ 1,00"

# Chips: medidas transversais. O mesmo real já está em alguma linha; o chip diz quanto daquela linha é isso.
# Calculados no SIOP (ano fechado), no mesmo universo do RREO, com o filtro do chip E o filtro da linha. O resíduo
# recebe o que sobra, fora as subfunções excluídas (841-844).
chips:
  - id: folha_ativos
    nome: Salários e encargos de servidores ativos
    definicao: >
      Grupo 1 (pessoal e encargos sociais) menos aposentadorias, reservas, reformas e pensões (elementos 01 e 03).
      Inclui salários de civis e militares da ativa, encargos patronais com o RGPS de empregados públicos,
      sentenças judiciais de pessoal e benefícios como auxílio-alimentação. Transversal às linhas: não é linha, para
      não contar duas vezes.
    base: siop_elemento
    filtro: "cod_gnd = '1' AND COALESCE(cod_elemento_despesa, '') NOT IN ('01', '03')"
    status: implementado
  - id: emendas
    nome: Indicação parlamentar (emendas)
    definicao: >
      Despesa com identificador de resultado primário 6 (emendas individuais), 7 (de bancada), 8 (de comissão) e 9
      (de relator, o "orçamento secreto", extinto depois de 2022). É dinheiro cuja destinação foi decidida por
      parlamentares, dentro das linhas onde foi gasto (saúde, assistência, transferências...). O valor do chip é o
      liquidado no exercício, a métrica do recibo, e subestima o tamanho das emendas: o empenhado (o carimbo do
      Congresso) foi R$ 47,1 bi em 2025 contra R$ 31,7 bi liquidados; individuais liquidam 83% do empenhado no ano,
      de bancada 55%, de comissão 48%. Emenda de custeio da saúde (repasse fundo a fundo) liquida no ano (87%);
      emenda de obra (urbanismo 2%, agricultura 12%) fica em restos a pagar. Por isso a ficha traz também
      dotação, empenhado e pago: pelo liquidado a Saúde é 71% das emendas; pelo empenhado, 54%.
    base: siop_rp
    filtro: "cod_resultado_primario IN ('6', '7', '8', '9')"
    status: implementado
  - id: investimento
    nome: Investimento
    definicao: >
      Grupo 4 (investimentos: obras, equipamentos, material permanente) liquidado no exercício, inclusive o
      transferido a estados e municípios com carimbo de obra. Subestima: investimento é a despesa que mais fica
      para o ano seguinte como restos a pagar; o memo restos_a_pagar mostra o investimento pago no ano somando os
      restos (Anexo 06). Não inclui inversões financeiras (grupo 5) nem o investimento das estatais.
    base: siop_gnd
    filtro: "cod_gnd = '4'"
    status: implementado

# Memos: números publicados ao lado do recibo, fora do R$ 1,00 (receitas, déficit, juros, dívida, restos a pagar).
# Cada um sai com valor, componentes, notas e as chaves do Anexo 06 / Anexo 01 que usou. O código calcula pelo id;
# um memo marcado "implementado" sem cálculo no código derruba o mart (ConfigInvalida).
memos:
  - id: tributos
    nome: Tributos (impostos, taxas e contribuições)
    definicao: >
      Impostos (IR, IPI, IOF, imposto de importação...), taxas e contribuições (INSS, COFINS, CSLL, PIS/PASEP, CIDE)
      arrecadados pela União no período. É o dinheiro que sai do bolso de pessoas e empresas por obrigação de lei.
      Valor do Anexo 06 (receita primária), conferido ao centavo com o Anexo 01 (tributos_anexo01_vs_anexo06).
    unidade: reais
    status: implementado
  - id: receita_primaria
    nome: Receita primária total
    definicao: >
      Tudo o que o governo arrecadou sem se endividar: tributos mais royalties e dividendos (receita patrimonial),
      venda de bens, taxas de serviço e outras receitas. É o lado "entrou" da conta do déficit (Anexo 06, linha III).
    unidade: reais
    status: implementado
  - id: receitas_financeiras
    nome: O que entrou além da receita primária
    definicao: >
      Dinheiro que entrou no caixa e não é arrecadação: títulos vendidos além da rolagem (dívida nova), rendimento
      do caixa do Tesouro no Banco Central, resultado do Banco Central repassado, empréstimos que tomadores
      devolveram e algumas receitas que o Tesouro classifica como financeiras (parte da patrimonial e dos serviços).
      É a diferença entre as receitas do Anexo 01 (exceto intra, linha I) e a receita primária do Anexo 06. A rolagem
      (linha IV do Anexo 01) aparece ao lado, fora do total: é título novo pagando título velho.
    unidade: reais
    status: implementado
  - id: gasto_por_real_de_tributo
    nome: Gasto por R$ 1,00 de tributo
    definicao: >
      Quanto o governo gastou (o total do recibo: despesa primária mais juros pagos) para cada R$ 1,00 de tributo
      arrecadado. Acima de R$ 1,00, a diferença veio de outras receitas e de dívida nova.
    unidade: reais_por_real
    status: implementado
  - id: origem_do_real_gasto
    nome: De onde veio cada R$ 1,00 gasto
    definicao: >
      De cada R$ 1,00 que o governo gastou, quantos centavos vieram de tributos, quantos de outras receitas
      (royalties, dividendos, serviços, venda de bens) e quantos foram cobertos com dívida nova ou com o caixa.
      Conta pelo gasto liquidado do recibo; o déficit oficial usa o pago, com restos a pagar (memo resultado_primario).
    unidade: centavos
    status: implementado
  - id: resultado_primario
    nome: Resultado primário (déficit antes dos juros)
    definicao: >
      Receita primária menos despesa primária paga no ano, inclusive contas de anos anteriores pagas agora (restos a
      pagar). Negativo é déficit: o governo gastou mais do que arrecadou, antes de contar os juros. O Tesouro publica
      dois números: "acima da linha" (linha IX: a conta de receitas e despesas mais um "ajuste metodológico" que,
      segundo a nota 1 do próprio anexo, é a diferença para o número do boletim mensal do Tesouro, o Relatório do
      Tesouro Nacional, que segue o Manual de Estatísticas de Finanças Públicas; o anexo não abre os itens) e "abaixo
      da linha" (linha XXVII: pela variação da dívida consolidada líquida do próprio RREO, com ajustes). Os dois saem
      aqui, com a conta aberta. Em 2024 e 2025 o abaixo da linha é igual ao centavo à conta de caixa antes do ajuste.
      Atenção: não é a conta do Banco Central (NFSP); essa é outra régua e sai no mart da dívida (em 2024, o BC
      apurou déficit primário de R$ 45,4 bi para o Governo Central, contra R$ 47,96 bi aqui).
    unidade: reais
    status: implementado
  - id: juros_nominais
    nome: Juros que a dívida gerou (competência)
    definicao: >
      Juros, encargos e variações monetárias que a dívida pública gerou no período, pela competência (venceram,
      mesmo que ainda não tenham sido pagos em dinheiro), menos os que o governo recebeu de quem lhe deve (Anexo 06,
      linhas XI e X). Compare com os juros pagos, que estão na linha "Juros da dívida" do recibo: a diferença é juro
      que virou dívida nova.
    unidade: reais
    status: implementado
  - id: resultado_nominal
    nome: Resultado nominal (déficit com os juros)
    definicao: >
      Resultado primário mais os juros líquidos: o déficit completo. É o quanto a dívida precisou crescer para
      fechar a conta do período. Acima da linha (XII) pelo Tesouro; abaixo da linha (XVII, a variação da dívida
      consolidada líquida do RREO) e ajustado (XXVI). A conta do Banco Central (NFSP) é outra régua: mart da dívida.
    unidade: reais
    status: implementado
  - id: divida
    nome: Dívida consolidada e dívida líquida
    definicao: >
      Dívida consolidada (tudo o que a União deve) e dívida consolidada líquida (descontando o caixa e o que a União
      tem a receber), no fim do ano anterior e no fim do período (Anexo 06, linhas XIII, XIV e XVI). O valor do memo
      é a variação da líquida no período: a dívida nova.
    unidade: reais
    status: implementado
  - id: restos_a_pagar
    nome: Contas de anos anteriores pagas neste ano (restos a pagar)
    definicao: >
      Restos a pagar processados e não processados pagos no período (Anexo 06, colunas b e c da despesa primária).
      O recibo usa o liquidado do próprio ano; investimento é o grupo em que isso mais pesa, por isso o memo mostra o
      investimento pago no ano somando os restos.
    unidade: reais
    status: implementado
  - id: emprestimos_retorno
    nome: Empréstimos que voltaram
    definicao: >
      O que tomadores devolveram ao Tesouro no período (receita de capital "Amortizações de Empréstimos" do
      Anexo 01), ao lado do que foi emprestado (exclusão emprestimos_financeiros). Perdão e calote não aparecem no
      orçamento (ficam no balanço patrimonial, BGU): fonte a definir na torneira da dívida.
    unidade: reais
    status: implementado
  - id: por_habitante
    nome: Gasto e tributos por habitante
    definicao: >
      O total do recibo, os tributos e cada uma das linhas divididos pela população do Brasil no ano (IBGE, projeção
      revisão 2024, população em 1º de julho; fonte S14). É o mesmo dinheiro das linhas, só que por pessoa: "de cada
      brasileiro, R$ X saíram em tributos federais e R$ Y foram para o INSS". Nenhum centavo do recibo muda. Só sai
      quando a projeção e a estimativa oficial do IBGE, nos anos em que as duas existem, são o mesmo número.
    unidade: reais_por_habitante
    status: implementado
  - id: imposto_futuro
    nome: Dívida nova por habitante
    definicao: >
      Variação da dívida consolidada líquida no período (memo divida, Anexo 06 do RREO) dividida pela população do
      ano (IBGE, S14): quanto cada brasileiro passou a dever a mais, pela régua da Lei de Responsabilidade Fiscal. É
      imposto futuro: dívida se paga com tributo depois. O mart da dívida traz a mesma conta com as outras réguas
      (DPF do Tesouro, dívida líquida pelo Banco Central).
    unidade: reais_por_habitante
    status: implementado

reconciliacoes:
  - id: hierarquia
    descricao: Soma das subfunções = soma das funções (valida a derivação da hierarquia a partir da ordem das linhas).
    critica: true
  - id: total_cabecalho
    descricao: Soma das funções = total "Despesas (exceto intraorçamentárias)" do próprio Anexo 02.
    critica: true
  - id: total_anexos
    descricao: Total exceto intra do Anexo 02 = DespesasExcetoIntraOrcamentarias do Anexo 01 (mesmo universo).
    critica: true
  - id: fu_prefixo_consistente
    descricao: O prefixo "FUxx" nunca discorda da função vista na ordem das linhas.
    critica: true
  - id: residual_nao_negativo
    descricao: O residual (máquina e demais funções) não pode ser negativo.
    critica: true
  - id: centavos_somam_100
    descricao: Os centavos publicados somam exatamente 100.
    critica: true
  - id: identidade_total
    descricao: >
      Soma das linhas do recibo = despesa primária liquidada do Anexo 06 (conta oficial do Tesouro) + juros e
      encargos da dívida do Anexo 01. Vale por construção quando o ajuste do serviço da dívida está ligado; se
      alguém desligar o ajuste ou a fonte mudar, acusa.
    critica: true
  - id: exclusao_financeira_por_grupo
    descricao: >
      O que fica fora do R$ 1,00 além da amortização (despesa exceto intra - amortização - despesa primária - juros)
      tem que ser igual à soma, por grupo de despesa, de Anexo 01 menos a parte primária do Anexo 06 (pessoal, outras
      despesas correntes, investimentos, inversões financeiras). Se um grupo novo aparecer num dos anexos, acusa.
      Tolerância de 1 em 10 milhões (o RREO de 2023 vem em dezenas de reais; a soma de sete linhas arredondadas não
      fecha ao centavo).
    critica: true
    tolerancia_relativa: 0.0000001
  - id: exclusao_por_linha
    descricao: >
      O que sai das linhas nomeadas pelo carimbo da lei (GND 5 com RP 0 no SIOP: FAT/BNDES de Trabalho, FIES de
      Educação) tem que caber dentro do total que o Tesouro trata como financeiro; o resto sai do resíduo.
    critica: true
  - id: tributos_anexo01_vs_anexo06
    descricao: >
      Impostos, taxas e contribuições do Anexo 01 (ReceitaTributaria + ReceitaDeContribuicoes, exceto intra) =
      os mesmos do Anexo 06 (RREO6ReceitasTributarias + RREO6ReceitasDeContribuicoes). Em 2024 e 2025 bateu ao
      centavo (R$ 1.146.491.700.715,94 de impostos e taxas em 2025).
    critica: true
    tolerancia_relativa: 0.0000001
  - id: receitas_anexo01_hierarquia
    descricao: >
      Receitas do Anexo 01: correntes = soma das suas contas; capital = soma das suas contas; exceto intra (I) =
      correntes + capital. Se a União criar uma conta nova, acusa.
    critica: true
  - id: receitas_anexo06_hierarquia
    descricao: >
      Receitas primárias do Anexo 06: correntes (I) = tributárias + contribuições + patrimonial + transferências +
      demais; capital (II) = alienação + transferências de capital + outras; total (III) = I + II.
    critica: true
  - id: despesas_anexo06_hierarquia
    descricao: >
      Despesas primárias liquidadas do Anexo 06: correntes (IV) = pessoal + outras correntes; outras correntes =
      transferências constitucionais e legais + demais; capital (V) = investimentos + inversões; total (VII) =
      IV + V + reserva de contingência.
    critica: true
  - id: resultado_primario_acima_da_linha
    descricao: >
      Resultado primário acima da linha (IX) = receita primária realizada (III) - despesa primária paga - restos a
      pagar processados pagos - restos a pagar não processados pagos + ajuste metodológico (quando existe). É a
      própria fórmula do Tesouro; conferida ao centavo de 2023 a 2026.
    critica: true
  - id: pessoal_anexo06_vs_anexo01
    descricao: Pessoal e encargos liquidados do Anexo 06 contra PessoalEEncargosSociais do Anexo 01. Iguais em 2023 a 2026.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: investimentos_anexo06_vs_anexo01
    descricao: Investimentos liquidados do Anexo 06 contra Investimentos do Anexo 01. Iguais em 2023 a 2026.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: resultado_nominal_acima_da_linha
    descricao: Resultado nominal acima da linha (XII) = resultado primário (IX) + juros ativos (X) - juros passivos (XI).
    critica: false
  - id: resultado_primario_abaixo_da_linha
    descricao: Resultado primário abaixo da linha (XXVII) = resultado nominal ajustado (XXVI) - (juros ativos - juros passivos).
    critica: false
  - id: divida_liquida_identidade
    descricao: Dívida consolidada líquida (XVI) = dívida consolidada (XIII) - deduções (XIV), no saldo final.
    critica: false
  - id: nominal_abaixo_vs_divida_liquida
    descricao: >
      Resultado nominal abaixo da linha (XVII) = dívida consolidada líquida no início do período - no fim: o déficit
      completo é a dívida nova, com o sinal trocado. Igual ao centavo em 2023 a 2026 (R$ 907,9 bi, 1.076,0, 845,7 e
      801,9 até agosto de 2026).
    critica: false
  - id: lei_vs_tesouro_inversoes
    descricao: >
      Inversões financeiras que a lei orçamentária carimba como financeiras (GND 5 com RP 0 no SIOP) contra as que o
      Tesouro trata como financeiras (InversoesFinanceiras do Anexo 01 menos a parte primária do Anexo 06). A
      diferença fica dentro do R$ 1,00, no resíduo: em 2025, R$ 31,9 bi (R$ 27,6 bi de fundos constitucionais
      FNE/FNO/FCO e R$ 4,3 bi sem ação identificada); em 2024, R$ 27,3 bi (24,8 + 2,4); em 2023, R$ 25,3 bi
      (21,4 + 3,9). Acusa só se o Tesouro passar a tratar como financeiro mais do que a lei carimba.
    critica: false
  - id: servico_divida_fora_843_844
    descricao: >
      Juros + amortização (Anexo 01) menos subfunções 843/844: parcela do serviço da dívida classificada em outras
      subfunções. Ideal zero; tolerada até 2% da despesa exceto intra. Em 2024/6 deu R$ 40,8 bi (1,2%); em 2025
      deu R$ 124,0 bi (3,3%), acima da tolerância, mas explicada ao real pela conferência do SIOP
      (servico_divida_fora_843_844_siop: ação 0669, cobertura do Banco Central). Quando a conferência do SIOP
      passa, esta é marcada "explicada" e não acusa; só acusa quando o SIOP não explica (ano em andamento, por
      exemplo). Em 2026/4, zero; em 2023, -R$ 2,26 (o RREO de 2023 vem em dezenas de reais), que conta como zero:
      negativo do tamanho do arredondamento da fonte (R$ 1 ou um bilionésimo do total) passa.
    critica: false
    tolerancia_relativa: 0.02
    explicada_por: servico_divida_fora_843_844_siop
  - id: inss_vs_beneficios_anexo01
    descricao: >
      Previdência Básica (271) deve ficar a menos de 5% de BeneficiosPrevidenciarios do Anexo 01. Diferença de
      R$ 25,3 bi em 2024/6 (2,7%), R$ 38,0 bi em 2025/6 (3,7%) e R$ 37,9 bi em 2026/4 (4,9%); hipótese: sentenças
      judiciais e compensação previdenciária do RGPS classificadas em Encargos Especiais (846). Em 2023 acusou
      (R$ 54,3 bi, 6,0%): os R$ 37,8 bi de precatórios da seguridade pagos em dezembro de 2023 na 846 explicam a
      maior parte.
    critica: false
    tolerancia_relativa: 0.05
  - id: variacao_anual
    descricao: >
      Cada linha do recibo comparada com o mesmo período do exercício anterior (2026/p4 contra 2025/p4; 2025/p6
      contra 2024/p6). Mesmo período, porque o gasto não é um sexto por bimestre (13º, abono, cupons de títulos,
      obras em dezembro). Variação acima do limite é aviso, não erro: pode ser economia real, calendário ou
      mudança de classificação na fonte. Em 2025/6 (v0.3.0) acusou o resíduo (+25,5%): precatórios de volta ao
      normal depois do vale de 2024 (dezembro de 2023 pagou o estoque adiado), empréstimos novos e Agricultura
      (+99%, dois terços empréstimo); investigue com `recibo diff` e `recibo inspect siop`.
    critica: false
    limite_relativo: 0.15
  - id: fontes_total_vs_anexo01
    descricao: >
      A despesa por fonte de recursos do SIOP (todos os grupos de natureza, com o refinanciamento) soma o total do
      Anexo 01 do RREO com o refinanciamento: nenhuma fonte fica de fora do carimbo. Informativa: se não fechar, a visão
      do caixa sai sem o detalhe por fonte e o recibo não muda.
    critica: false
  - id: niveis_fecham
    descricao: >
      Os níveis de dentro de cada linha (subfunções do RREO, funções do resíduo, elementos do SIOP), com os ajustes
      nomeados, somam o valor da linha. É o que o site abre quando a pessoa clica numa faixa; a conta tem que fechar
      linha a linha. Informativa: uma linha que não feche sai no site sem abertura, com o motivo, e o recibo não muda.
    critica: false

  # Conferências cruzadas com o SIOP (S8): fonte independente do RREO, sobre o mesmo universo (orçamentos fiscal e
  # da seguridade, sem intraorçamentárias, sem refinanciamento quando se compara com o Anexo 02). Só em ano fechado.
  # Calibradas em 2025 (9/nov): juros com diferença de R$ 0,57, GND 6 total com R$ 2,20, e com refinanciamento
  # definido como GND 6 + fonte 443 as funções batem ao real. O SIOP publica valores em reais inteiros, por isso a
  # tolerância é de 1 em 10 milhões (R$ 370 mil num total de R$ 3,7 tri), não zero. Toda tolerância relativa tem um
  # piso absoluto igual ao das identidades (R$ 1 ou um bilionésimo do total): um esperado perto de zero não vira
  # tolerância zero (2023: -R$ 2,26 contra 0,00 reprovava o ano). Como a linha de aposentados agora vem do SIOP, as
  # duas conferências que garantem que as fontes descrevem o mesmo universo são críticas.
  - id: siop_vs_rreo_funcao
    descricao: >
      Liquidado por função no SIOP (OFSS, sem modalidade 91, sem refinanciamento) contra a soma das funções do
      Anexo 02 (exceto intra). O detalhe lista as funções fora da tolerância. Crítica: se as duas fontes não
      descrevem o mesmo bolo, as transferências entre linhas não podem ser feitas.
    critica: true
    tolerancia_relativa: 0.0000001
  - id: siop_juros_vs_anexo01
    descricao: GND 2 (juros e encargos) no SIOP contra JurosEEncargosDaDivida do Anexo 01. Em 2025, diferença de R$ 0,57.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: siop_gnd6_vs_anexo01
    descricao: >
      GND 6 (amortização, inclusive refinanciamento) no SIOP contra AmortizacaoDaDivida + AmortizacaoRefinanciamentoDaDivida
      do Anexo 01. Em 2025, diferença de R$ 2,20.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: siop_refinanciamento_vs_anexo01
    descricao: >
      GND 6 com fonte 443 no SIOP contra a linha XII do Anexo 01. É a mesma definição (o RREO separa a rolagem pela
      fonte de recursos): em 2025, R$ 1.417,6 bi dos dois lados, inclusive os R$ 13,8 bi que estão fora de 841/842.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: servico_divida_fora_843_844_siop
    descricao: >
      GND 2 e 6 fora das subfunções 841-844 (sem refinanciamento) medidos no SIOP, contra o excesso que o RREO só
      estima por diferença (servico_divida_fora_843_844). Crítica: é o que transforma o ajuste em valor nomeado. O
      detalhe lista as ações: em 2024 e 2025, 0669 "Cobertura do Resultado Negativo Apurado no Banco Central do
      Brasil" (R$ 40,7 bi e R$ 124,0 bi).
    critica: true
    tolerancia_relativa: 0.0000001
  - id: inativos_pensionistas_siop_vs_rreo
    descricao: >
      Elementos 01 e 03 do SIOP dentro do recorte do RREO (subfunções 272 e 274) contra o valor do RREO nesse recorte.
      A diferença é o que está nessas subfunções sem ser aposentadoria ou pensão (em 2025, cerca de R$ 1 bi).
    critica: false
    tolerancia_relativa: 0.02
  - id: siop_investimentos_vs_anexo01
    descricao: GND 4 no SIOP (OFSS, sem intra) contra Investimentos do Anexo 01. Sustenta o chip de investimento.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: siop_pessoal_vs_anexo01
    descricao: GND 1 no SIOP (OFSS, sem intra) contra PessoalEEncargosSociais do Anexo 01. Sustenta o chip de folha de ativos e a linha de aposentados.
    critica: false
    tolerancia_relativa: 0.0000001
  - id: siop_inversoes_vs_anexo01
    descricao: >
      GND 5 no SIOP (OFSS, sem intra) contra InversoesFinanceiras do Anexo 01. Sustenta a atribuição por linha dos
      empréstimos: o detalhe separa a parte que a lei carimba como financeira (RP 0) da primária (RP 1, 2, 3 e
      emendas). Em 2025: R$ 172,9 bi dos dois lados; RP 0 R$ 160,3 bi, primária R$ 12,6 bi (7%).
    critica: false
    tolerancia_relativa: 0.0000001
  - id: subfuncoes_ref_vs_siop
    descricao: >
      Os apelidos de subfunção de config/ref/subfuncoes.csv (nome do RREO -> código) conferidos contra os rótulos do
      SIOP no exercício: um nome que no CSV aponta para um código e no SIOP tem outro código é erro de referência
      (não muda centavo, porque nenhuma linha filtra esses códigos, mas o `diff` e as fichas imprimiriam o código
      errado). Achado em 9/nov: "Promoção da Produção Agropecuária" era 601 no CSV e é 608 no SIOP; "Defesa
      Agropecuária" era 604 e é 609. O detalhe também lista nomes que o SIOP usa e o CSV ainda não conhece: em 9/nov,
      245 "Serviços Socioassistenciais" e 246 "Segurança de Renda" (subfunções novas da assistência a partir de 2025,
      a reclassificação do Bolsa Família que o RREO mostra como "FU08 - Demais") e três renomeações (241, 391, 422),
      todas incluídas no CSV na v0.4.1.
    critica: true
  - id: siop_comparavel
    descricao: >
      Emitida em ano em andamento: o SIOP é acumulado até a última atualização do grafo, o RREO até o bimestre, então
      as conferências cruzadas não rodam. O detalhe traz o serviço da dívida fora de 841-844 até a data do SIOP.
    critica: false

# Parâmetros das conferências cruzadas e das linhas que usam o SIOP.
siop:
  agregacao_gnd: fonte_gnd_subfuncao
  agregacao_acao: acao_subfuncao
  agregacao_acao_rp: acao_rp_subfuncao     # ação com RP: lista o que foi emprestado (GND 5, RP 0), por linha e no total
  agregacao_elemento: elemento_orgao
  agregacao_rp: rp_subfuncao
  subfuncoes_servico_divida: ["841", "842", "843", "844"]
  subfuncao_outros_encargos: "846"
  acoes_listadas: 40                        # quantas ações entram na lista do "Fora do R$ 1,00" (export e hover)
  niveis_acoes_maximo: 0                    # ações por subfunção e órgãos por elemento nos níveis do export (0 = todas: o site mostra tudo)
  # Uma subfunção de onde saiu dinheiro para uma linha medida por elemento de despesa (aposentados e pensionistas,
  # elementos 01 e 03) não abre por ação quando o que saiu passa desta fração do que as ações do SIOP somam nela: a
  # agregação por ação não traz o elemento, então as ações apareceriam inteiras, com dinheiro que já está em outra faixa
  # (2025: Previdência do Regime Estatutário no resíduo, 99% fora; Administração Geral da Defesa, 48%). Abaixo da
  # fração, as ações aparecem inteiras e a ficha diz quanto está em outra faixa. Débito da V2 (DEBITOS.md): a agregação
  # ação x elemento abre todas sem ressalva.
  niveis_acoes_saida_maxima: 0.25

# ---------------------------------------------------------------------------------------------------------------------
# Fontes de recursos (S8, SIOP): com que dinheiro cada despesa foi paga, pelo carimbo da fonte na lei orçamentária.
# É o que a visão "Tudo o que passou pelo caixa" usa no lugar do rateio: título tem carimbo (fontes 443 e 444 só pagam
# o que a lei autoriza), então dá para dizer quanto do dinheiro de título pagou principal, juros e o resto, e com que
# dinheiro o gasto de verdade foi pago. O primeiro dígito do código diz quando o dinheiro entrou (1 e 2: no ano; 3 e 6:
# em anos anteriores, o "colchão"). Só no ano fechado, como todo cruzamento com o SIOP. Observado em 2025: 1443 e 3443
# (refinanciamento) somam R$ 1,42 tri, igual à rolagem do RREO; 1444, 3444 e 7444 (títulos novos) somam R$ 0,60 tri.
# ---------------------------------------------------------------------------------------------------------------------
fontes_de_recursos:
  agregacao: fonte_gnd_subfuncao
  origem_por_digito: {"1": corrente, "2": corrente, "3": anteriores, "6": anteriores}   # demais dígitos: outros
  grupos:                                    # a ordem importa: o primeiro regex que casar com o nome da fonte vence
    - id: titulos_novos
      nome: Títulos novos (dívida nova)
      regex: "Recursos Oriundos de T[íi]tulos do Tesouro"      # "Demais Aplicações Autorizadas para Recursos Oriundos de Títulos do Tesouro Nacional, Excetuado o Refinanciamento..."
    - id: titulos_refinanciamento
      nome: Títulos vendidos para a rolagem
      regex: "^Refinanciamento da D[ií]vida P[úu]blica Federal"
    - id: receitas_para_divida
      nome: Receitas carimbadas para pagar dívida
      regex: "^(Pagamento da D[ií]vida P[úu]blica Mobili[áa]ria Federal|Amortiza[çc][ãa]o da D[ií]vida P[úu]blica Federal)"
    - id: receita
      nome: Receita (tributos, contribuições e demais fontes)
      resto: true
  destinos:                                  # por grupo de natureza da despesa (GND) e pela marca de refinanciamento
    rolagem: "Principal de títulos velhos (rolagem)"
    principal: "Principal pago com dinheiro do caixa"
    juros: "Juros da dívida"
    primaria: "Despesa primária (gasto, sem os juros)"
    inversoes: "Empréstimos, aplicações e participações"
  gnd: {"1": "Pessoal e encargos sociais", "2": "Juros e encargos da dívida", "3": "Outras despesas correntes", "4": "Investimentos", "5": "Inversões financeiras", "6": "Amortização da dívida"}

# ---------------------------------------------------------------------------------------------------------------------
# COFOG (S7): produto separado do recibo, `recibo mart cofog --exercicio AAAA`. É a despesa do Governo Central medida
# pela régua internacional (manual de estatísticas fiscais do FMI, GFSM 2014, funções COFOG), como o Tesouro publica.
# Serve para quem pergunta "e pelo padrão internacional?"; não entra no R$ 1,00 do recibo, que segue a conta de caixa
# do Tesouro (Anexo 06 + juros pagos). O que liga os dois é a ponte abaixo: partindo do total do recibo e somando só o
# que o COFOG declaradamente faz diferente, o total do COFOG tem que aparecer dentro da tolerância; se não aparecer,
# o mart do COFOG não é publicável (o recibo continua sendo). Observado em 9/nov/2026: diferença não explicada de
# -0,31% em 2024 e -0,66% em 2023.
cofog:
  ref: ref/cofog.csv                        # nomes das dez divisões e dos 69 grupos
  ponte:
    tolerancia_relativa: 0.02               # 2% do total do COFOG: folga para o que o COFOG mede por caixa, aperto para pegar erro de unidade ou de ano
    # Ajustes metodológicos do Tesouro que ACRESCENTAM ao total (casados por prefixo do texto da coluna, sem acento). Os
    # demais ajustes (FUNDEB, Fundo do DF, precatórios, bolsas, Minha Casa Minha Vida, Pé-de-Meia...) remanejam despesas
    # que já estão no orçamento para a função certa e não somam: a ponte fecha em 0,3% sem eles e abriria 173 bi com eles.
    somam:
      juros:
        prefixo: "JUROS"
        nome: "Juros pelo Banco Central, por competência (o que a dívida gerou no ano, pago ou não), no lugar dos juros pagos em dinheiro"
      irrf:
        prefixo: "TRANSFERENCIA DO IRRF"
        nome: "Imposto de renda retido na fonte que estados e municípios descontam dos próprios servidores e ficam (não passa pelo orçamento da União; o manual do FMI manda contar como arrecadado e transferido)"
      alienacoes:
        prefixo: "RECEITA DE ALIENACOES"
        nome: "Venda de bens (o COFOG desconta do investimento; no orçamento é receita)"
  # O que o leitor precisa saber para não comparar os dois totais como se fossem a mesma conta.
  glossario:
    - termo: competência e caixa
      texto: >
        Caixa é quando o dinheiro sai; competência é quando a obrigação nasce. O recibo conta os juros pagos em dinheiro
        no ano (caixa). O COFOG conta os juros que a dívida gerou no ano, pagos ou não (competência), com o número do
        Banco Central. Por isso os juros pesam cerca do dobro na régua do COFOG.
    - termo: restos a pagar
      texto: >
        Contas de anos anteriores pagas neste ano. O RREO do ano não as conta como despesa deste ano; o COFOG soma as
        não processadas pagas (as que ainda não tinham sido conferidas quando o ano virou).
    - termo: IRRF retido por estados e municípios
      texto: >
        O imposto de renda descontado do salário dos servidores estaduais e municipais fica com o estado ou município,
        por regra da Constituição; a União nunca recebe nem paga. O manual do FMI manda registrar como se a União
        tivesse arrecadado e transferido, para países com arranjos diferentes ficarem comparáveis.
    - termo: venda de bens
      texto: >
        No orçamento, vender um prédio é receita. No COFOG, a venda entra negativa na gaveta de investimento (compra
        menos venda), porque trocar um bem por dinheiro não muda o patrimônio do governo.
    - termo: resolução
      texto: >
        A partir do arquivo de 2024 o Tesouro publica em R$ milhões com duas casas: cada linha só é precisa até R$ 10 mil.
        Somas de milhares de linhas carregam esse arredondamento; por isso a ponte tem tolerância em por cento, não em
        centavos.

# ---------------------------------------------------------------------------------------------------------------------
# DÍVIDA (S1 Tesouro + S16 BCB + Anexos 01/06 do recibo): produto separado, `recibo mart divida --exercicio AAAA`.
# Quatro medidas, cada uma com várias réguas nomeadas e nunca misturadas: juros do ano, dívida nova no ano, estoque,
# risco de rolagem. Layout de cada arquivo do Tesouro fixado aqui por rótulo e unidade, depois da primeira leitura real
# (9/nov/2026). Nada daqui entra no R$ 1,00 do recibo.
populacao:                                  # S14, IBGE: a régua do per capita (recibo e mart da dívida)
  regua_per_capita: projecao                # projeção revisão 2024, população em 1º de julho; única régua com 2022 e 2023
  local: Brasil
  projecao_xlsx:                            # layout da planilha tab3 (grupos etários específicos), visto em 10/nov/2026
    planilha: "3) POP_GRUPO ETÁRIO ESPECÍFICO"
    cabecalho_coluna1: ANO                  # a linha de cabeçalho é a primeira cuja coluna 1 é exatamente isto (linha 7)
    colunas:
      ano: ANO
      cod: "CÓD."
      sigla: SIGLA
      local: LOCAL
      populacao: POP_T
      homens: POP_H
      mulheres: POP_M
      idosos_65_mais: "65+_T"
  # guarda de escala para o Brasil: fora disto é unidade ou coluna errada, não gente
  brasil_minimo: 150000000
  brasil_maximo: 300000000
  reconciliacoes:
    - id: populacao_projecao_vs_estimativa
      descricao: >
        Nos anos em que o IBGE publica a estimativa oficial (tabela 6579, usada pelo TCU), ela tem que ser igual à
        projeção revisão 2024, de onde sai. Se divergir, o per capita não sai (fica indisponível, com o motivo) e o
        recibo e o mart da dívida continuam publicáveis: nenhum centavo deles depende da população.
      critica: false
      tolerancia_absoluta: 0
  glossario:
    - termo: população do ano
      texto: >
        O IBGE define a população de um ano como a de 1º de julho, o meio do ano. A projeção revisão 2024 dá um número
        por ano de 2000 a 2070 numa régua só; as estimativas oficiais (as que o TCU usa para dividir o Fundo de
        Participação dos Municípios) saem dela de 2024 em diante. O Censo 2022 contou 203,1 milhões; a projeção
        corrige a cobertura do Censo e dá 210,9 milhões para o mesmo ano, por isso os dois não se misturam.
    - termo: por habitante
      texto: >
        O valor dividido pela população do ano. É um jeito de ler o tamanho: R$ 352 bilhões de juros viram R$ 1.656
        por pessoa em 2024. Não é o que cada pessoa pagou (quem paga mais imposto paga mais), é a média.

divida:
  tolerancia_mes_referencia: dezembro       # ano fechado = dezembro presente em todas as fontes; senão "em andamento (até mês M)"
  estoque_xlsx:                             # Anexo 2.1 - Estoque da DPF: posição de fim de mês, R$ bilhões
    dataset: estoque_dpf
    arquivo_regex: "\\.xlsx$"
    planilha: "2.1"
    unidade: bilhoes
    linhas:
      dpf_publico: "DPF EM PODER DO PÚBLICO"
      dpmfi: "DPMFi"
      dpfe: "DPFe"
      dpmfi_bc: "DPMFi EM PODER DO BANCO CENTRAL"
  fatores_xlsx:                             # Anexo 2.9 - Fatores de variação da DPF: fluxos do mês, R$ milhões
    dataset: fatores_variacao
    arquivo_regex: "\\.xlsx$"
    planilha: "2.9"
    unidade: milhoes
    linhas:
      estoque_anterior: "Estoque anterior"
      estoque_fim: "Estoque mês em análise"
      variacao: "Variação Nominal"
      emissoes: "I.1.1 - Emissões"
      resgates: "I.1.2 - Resgates"
      juros: "I.2 - Juros Apropriados"
      juros_dpmfi: "- Juros Apropriados da DPMFi"
      juros_dpfe: "- Juros Apropriados da DPFe"
      operacoes_bc: "II - Operações do mercado com o Banco Central"
      total: "Total dos Fatores (I + II)"
  estoque_csv:                              # título a título, mês a mês, em reais (desde 2017)
    dataset: estoque_dpf
    arquivo_regex: "\\.csv$"
    unidade: reais
    colunas:
      mes: "Mes do Estoque"
      classe: "Classe da Carteira"
      tipo: "Tipo de Divida"
      valor: "Valor do Estoque"
      vencimento: "Vencimento do Titulo/Contrato"
      titulo: "Titulo/Contrato"
    valores:
      mercado: "Mercado"
      banco_central: "Banco Central"
      interna: "Dívida Interna"
      externa: "Dívida Externa"
    # indexador pelo começo do nome do título. Os regex são testados primeiro, na ordem; o que sobrar da dívida externa
    # é câmbio (externa: true); o resto vai para "demais". "Global BRL" é título externo emitido em reais, prefixado
    # (o Tesouro o conta assim no Relatório Mensal). O Tesouro classifica pelo indexador contratual de cada papel (TDA
    # pela TR entra como flutuante, securitizadas pelo IGP-DI como preços, algumas em dólar como câmbio), que o nome não
    # revela: por isso a composição do RMD difere daqui em até 0,1 ponto percentual (dez/2024: 46,29 / 21,99 / 26,96 /
    # 4,76 contra 46,18 / 21,99 / 26,84 / 4,73 aqui, mais 0,25 de "demais").
    indexadores:
      selic: {regex: "^LFT", nome: "Selic (taxa flutuante)"}
      prefixado: {regex: "^(LTN|NTN-F|Global BRL)", nome: "Prefixado"}
      precos: {regex: "^(NTN-B|NTN-C)", nome: "Índice de preços (IPCA, IGP-M)"}
      cambio: {regex: "^(NTN-D|NTN-A|NTN-I|Global|Euro|A-Bond)", externa: true, nome: "Câmbio"}
      demais: {nome: "Demais (TDA, securitizada, CVS...)"}
    vincendo_meses: 12                      # "principal que vence em N meses": só o valor do estoque dos títulos e contratos
                                            # com vencimento final no período. O Tesouro publica no RMD um "percentual vincendo
                                            # em 12 meses" maior, porque divide pelo estoque o fluxo de principal E juros dos 12
                                            # meses seguintes, trazido a valor presente (dez/2024: 17,87% lá, 15,67% aqui).
    # "Quando vence" (visão "A dívida" do site, v0.10.0): cada título ou contrato em mercado cai numa faixa pelo número de
    # meses entre o mês de referência e o vencimento final (até 12 meses = vence no mesmo mês do ano seguinte, como o
    # `vincendo_meses`). Dentro da primeira faixa o detalhe é mês a mês; nas outras, ano a ano. Vencimento já passado
    # ou no próprio mês entra na primeira faixa como "já vencido ou à vista". Sem data no arquivo: faixa própria.
    faixas_vencimento:
      - {id: ate_12m, nome: "Vence em até 12 meses", ate_meses: 12}
      - {id: de_1_a_2_anos, nome: "Vence de 1 a 2 anos", ate_meses: 24}
      - {id: de_2_a_5_anos, nome: "Vence de 2 a 5 anos", ate_meses: 60}
      - {id: mais_de_5_anos, nome: "Vence em mais de 5 anos", ate_meses: null}
    sem_vencimento: {id: sem_data, nome: "Sem data de vencimento no arquivo"}
  execucao_csv:                             # execução orçamentária e financeira da DPF por natureza, por ano e mês, em reais
    dataset: execucao_natureza
    arquivo_regex: "\\.csv$"
    unidade: reais
    colunas:
      exercicio: "Exercício"
      movimentacao: "Movimentação Financeira"
      tipo: "Tipo de Dívida"
      modalidade: "Modalidade da Dívida"
      carteira: "Carteira"
      natureza: "Natureza Despesa Detalhada Nome"
      meses: [janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    valores:
      juros: "Juros e Encargos"
      principal: "Principal"
      politica_monetaria: "Política Monetária"   # cobertura do resultado negativo do BC (ação 0669), fora da DPF: vale
                                                  # em "Tipo de Dívida" ou em "Modalidade da Dívida"
      cobertura_bc_regex: "^COBERTURA DO RESULTADO NEGATIVO"   # ou pelo nome da natureza (32902601 / 46902601)
    # Linhas repetidas no arquivo do Tesouro: em 2025 a cobertura do BC aparece duas vezes, com os mesmos valores em todas
    # as colunas menos "Tipo de Dívida" (uma vez como "Interna", outra como "Política Monetária"). O Anexo 01 e o SIOP
    # trazem o valor uma vez só (12,78 bi de juros e 111,25 bi de principal). Linhas iguais em tudo menos nestas colunas
    # são contadas uma vez, e o mart avisa quantas e quanto. Em 2024 e 2023 não há repetição.
    duplicatas_ignorando: ["Tipo de Dívida"]
  tesouro_direto_csv:                       # estoque do Tesouro Direto, título a título, mês a mês, em reais
    dataset: tesouro_direto_estoque
    arquivo_regex: "\\.csv$"
    unidade: reais
    colunas:
      mes: "Mes Estoque"
      tipo: "Tipo Titulo"
      valor: "Valor Estoque"
  bcb:                                      # séries do SGS (sources.yaml, S16) por papel no mart
    juros_gf: 4607
    juros_bc: 4608
    juros_gc: 4606
    juros_consolidado: 4616
    primario_gf: 4640
    primario_gc: 4639
