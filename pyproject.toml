[project]
name = "recibo"
version = "0.11.1"
description = "Pipeline aberto: de cada R$ 1,00 de imposto, quantos centavos foram para onde. Fase 1: Recibo do Contribuinte."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "markdown>=3.6",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-storage>=2.16",
  "google-cloud-bigquery>=3.25",
]
dev = [
  "pytest>=8",
]

[project.scripts]
recibo = "recibo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recibo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
